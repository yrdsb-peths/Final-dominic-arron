<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Mage</title>
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: pointer; user-select: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── Sizing — recomputed on load and every resize ─────────────────
let W, H, S, GROUND_H, BIRD_X, U, PIPE_W, PIPE_GAP, GRAVITY, JUMP_V, BIRD_BOX, STARS;

// Original Flappy Bird feel: constant speed, no ramp
const BASE_SPD_FACTOR = 4;   // × S per frame

function layout() {
  W = canvas.width  = window.innerWidth  || 1280;
  H = canvas.height = window.innerHeight || 720;
  S = Math.min(W / 960, H / 540);

  GROUND_H = Math.round(55  * S);
  BIRD_X   = Math.round(W   * 0.20);
  U        = Math.max(1, Math.round(3 * S));
  PIPE_W   = Math.round(52  * S);
  PIPE_GAP = Math.round(175 * S);   // OG gap (not too generous, not brutal)
  GRAVITY  = 0.25 * S;              // OG gravity
  JUMP_V   = -5.8 * S;              // OG jump feel
  BIRD_BOX = Math.round(20  * S);

  STARS = Array.from({length: 180}, () => ({
    x:     Math.random() * W,
    y:     Math.random() * (H - GROUND_H - 50),
    w:     Math.random() < 0.72 ? 1 : 2,
    phase: Math.random() * Math.PI * 2,
    spd:   0.3 + Math.random() * 0.7,
  }));
}

// ── Persistent best score ────────────────────────────────────────
let best = 0;
try { best = +(localStorage.getItem('flappyMageBest') || 0) || 0; } catch (e) {}

// ── State ────────────────────────────────────────────────────────
// 'attract'  — auto-pilot self-playing idle (default / after death)
// 'playing'  — you have control
// 'dead'     — brief pause then back to attract
let state, bird, pipes, score, particles;
let deadTimer = 0, deathWasManual = false, lastScore = 0;
let lastInputT = 0, t = 0, groundX = 0;
const IDLE_REVERT = 7 * 60;   // frames idle in 'playing' before reverting to attract

function startGame(mode) {
  state     = mode;
  bird      = { y: H * 0.40, vy: 0 };
  pipes     = [];
  score     = 0;
  particles = [];
  pipeTimer = Math.round(210 * S);
}

let pipeTimer = 0;

function spawnPipe() {
  const min = Math.round(60 * S);
  const max = H - GROUND_H - PIPE_GAP - Math.round(60 * S);
  const topH = min + Math.random() * (max - min);
  pipes.push({ x: W + PIPE_W, topH, botY: topH + PIPE_GAP, scored: false });
}

// ── Input ────────────────────────────────────────────────────────
function onInput() {
  lastInputT = t;
  try { window.focus(); } catch (e) {}
  if (state === 'playing') { bird.vy = JUMP_V; return; }
  startGame('playing');
  bird.vy = JUMP_V;
}

// ── Draw helpers ─────────────────────────────────────────────────
function box(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ── Sky ──────────────────────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H - GROUND_H);
  g.addColorStop(0,   '#04000f');
  g.addColorStop(0.4, '#0a0530');
  g.addColorStop(1,   '#0c1238');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H - GROUND_H);
}

// ── Stars ────────────────────────────────────────────────────────
function drawStars() {
  for (const s of STARS) {
    const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.spd * 0.04 + s.phase));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dde8ff';
    ctx.fillRect(s.x, s.y, s.w, s.w);
  }
  ctx.globalAlpha = 1;
}

// ── Moon ─────────────────────────────────────────────────────────
function drawMoon() {
  const mx = W * 0.82, my = H * 0.13, mr = Math.round(38 * S);
  ctx.globalAlpha = 0.08; ctx.fillStyle = '#d8c880';
  ctx.beginPath(); ctx.arc(mx, my, mr + 14, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.14;
  ctx.beginPath(); ctx.arc(mx, my, mr + 7,  0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#d0c068';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#b0a050';
  ctx.beginPath(); ctx.arc(mx + mr*.25, my - mr*.30, mr*.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx - mr*.30, my + mr*.32, mr*.25, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e0d870';
  ctx.beginPath(); ctx.arc(mx - mr*.22, my - mr*.18, mr*.28, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000020';
  ctx.beginPath(); ctx.arc(mx + mr*.4, my + mr*.2, mr*.82, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

// ── Ground ───────────────────────────────────────────────────────
function drawGround() {
  const gy = H - GROUND_H;
  box(0, gy, W, GROUND_H, '#0f1e0e');
  box(0, gy, W, 4*S, '#1e4018');
  box(0, gy, W, 1.5*S, '#2a5420');
  const tw = Math.round(36 * S), ox = Math.round(groundX) % tw;
  ctx.fillStyle = '#162614';
  for (let x = -ox; x < W + tw; x += tw) {
    ctx.fillRect(x, gy + 4*S, Math.round(S), GROUND_H - 4*S);
    ctx.fillRect(x, gy + 4*S, tw, Math.round(S));
  }
  for (let i = 0; i < 24; i++) {
    const gx = ((i * 43 + groundX * 0.9) % (W + 30)) - 15;
    ctx.fillStyle = '#2a4828';
    ctx.fillRect(gx, gy - 2*S, S, 3*S);
    ctx.fillRect(gx + 4*S, gy - 3*S, S, 4*S);
    ctx.fillRect(gx + 8*S, gy - 2*S, S, 3*S);
  }
}

// ── Pipe ─────────────────────────────────────────────────────────
function drawPipe(px, topH, botY) {
  const cap = Math.round(14 * S), ext = Math.round(6 * S);
  box(px, 0, PIPE_W, topH, '#184818');
  box(px + 3*S, 0, 4*S, topH, '#2a6820');
  box(px + PIPE_W - 4*S, 0, 4*S, topH, '#0d2d0d');
  box(px - ext, topH - cap, PIPE_W + ext*2, cap, '#226222');
  box(px - ext, topH - cap, PIPE_W + ext*2, 2*S, '#2e8228');
  box(px - ext + 3*S, topH - cap, 4*S, cap, '#367030');
  box(px - ext, topH - 2*S, PIPE_W + ext*2, 2*S, '#102810');
  const botH = H - GROUND_H - botY;
  box(px, botY, PIPE_W, botH, '#184818');
  box(px + 3*S, botY, 4*S, botH, '#2a6820');
  box(px + PIPE_W - 4*S, botY, 4*S, botH, '#0d2d0d');
  box(px - ext, botY, PIPE_W + ext*2, cap, '#226222');
  box(px - ext, botY, PIPE_W + ext*2, 2*S, '#2e8228');
  box(px - ext + 3*S, botY, 4*S, cap, '#367030');
  box(px - ext, botY + cap - 2*S, PIPE_W + ext*2, 2*S, '#102810');
}

// ── Bird (pixel wizard) ──────────────────────────────────────────
function drawBird(y, vy) {
  const bx = BIRD_X, by = Math.round(y);
  const wOff = vy < -2*S ? -3*U : vy > 2*S ? 3*U : 0;

  ctx.globalAlpha = 0.18;
  box(bx - U, by + 11*U, 14*U, 2*U, '#000010');
  ctx.globalAlpha = 1;

  box(bx - 4*U, by + 3*U + wOff, 4*U, 3*U, '#b8a030');
  box(bx + 9*U, by + 3*U + wOff, 4*U, 3*U, '#b8a030');

  box(bx,      by + 3*U, 9*U, 8*U, '#e0c030');
  box(bx +  U, by + 3*U, 7*U, 2*U, '#f0d848');
  box(bx,      by + 9*U, 9*U, 2*U, '#b09020');

  box(bx - 3*U, by + 5*U, 4*U, 2*U, '#c0a828');
  box(bx - 5*U, by + 6*U, 3*U,   U, '#a08818');

  box(bx +   U, by, 7*U, 5*U, '#e8c838');
  box(bx + 2*U, by +   U, 5*U, U, '#f0d848');

  box(bx + 8*U, by + 2*U, 4*U, 2*U, '#e06020');
  box(bx + 8*U, by + 2*U, 4*U,   U, '#f07830');

  box(bx + 6*U, by +   U, 2*U, 2*U, '#000820');
  box(bx + 6*U, by +   U,   U,   U, '#ffffff');

  box(bx,        by - U,   9*U, 2*U, '#340a60');
  box(bx +   U,  by - U,   7*U,   U, '#4a1480');
  box(bx + 2*U, by - 4*U, 5*U, 3*U, '#2a0850');
  box(bx + 3*U, by - 7*U, 3*U, 3*U, '#220640');
  box(bx + 3*U, by - 9*U, 3*U, 2*U, '#1a0430');
  box(bx + 2*U, by - 4*U, 5*U, U, '#6820b0');
  box(bx + 4*U, by - 5*U, U, U, '#e8d040');
}

// ── Particles ────────────────────────────────────────────────────
const PCOLS = ['#e0c030','#ff8820','#38d8ff','#e84040','#a840ff','#40ff80'];
function spawnBurst(bx, by) {
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2, spd = (1.5 + Math.random() * 3.5) * S;
    particles.push({
      x: bx, y: by,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 2.5*S,
      col: PCOLS[i % PCOLS.length],
      life: 0, max: 28 + Math.random() * 22,
    });
  }
}
function tickParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.18*S; p.life++;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p.life / p.max;
    box(p.x, p.y, 3*S, 3*S, p.col);
  }
  ctx.globalAlpha = 1;
}

// ── Collision ────────────────────────────────────────────────────
function collides(by) {
  const top = by + U, bot = by + BIRD_BOX - U;
  const lft = BIRD_X + 2*U, rgt = BIRD_X + BIRD_BOX - 3*U;
  if (top < 0 || bot > H - GROUND_H) return true;
  for (const p of pipes) {
    if (rgt > p.x + 2*U && lft < p.x + PIPE_W - 2*U)
      if (top < p.topH || bot > p.botY) return true;
  }
  return false;
}

// ── Score HUD ────────────────────────────────────────────────────
function drawScore() {
  const fs = Math.round(22 * S), pw = Math.round(100 * S), ph = Math.round(32 * S);
  ctx.globalAlpha = 0.55;
  box(W/2 - pw/2, 14*S, pw, ph, '#000010');
  ctx.globalAlpha = 1;
  box(W/2 - pw/2, 14*S, pw, S, '#28185a');
  box(W/2 - pw/2, 14*S + ph, pw, S, '#28185a');
  ctx.fillStyle = '#e8d060';
  ctx.font = `bold ${fs}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(score, W/2, 14*S + ph - 6*S);
}

// Fading toast after a manual death
function drawToast(alpha) {
  ctx.globalAlpha = alpha * 0.92;
  ctx.fillStyle = '#e8d060';
  ctx.font = `bold ${Math.round(36*S)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(`✦ ${lastScore} ✦`, W/2, H * 0.42);
  ctx.fillStyle = '#50d058';
  ctx.font = `bold ${Math.round(14*S)}px monospace`;
  ctx.fillText(`best  ${best}`, W/2, H * 0.42 + 30*S);
  ctx.globalAlpha = 1;
}

// Subtle blinking hint while in attract
function drawHint() {
  if (Math.floor(Date.now() / 650) % 2) return;
  const txt = '▶  click to play';
  ctx.font = `bold ${Math.round(13*S)}px monospace`;
  ctx.textAlign = 'center';
  const tw = ctx.measureText(txt).width + 28*S, th = Math.round(24*S);
  const tx = W/2 - tw/2, ty = H - GROUND_H - 46*S;
  ctx.globalAlpha = 0.5; box(tx, ty, tw, th, '#000018'); ctx.globalAlpha = 1;
  box(tx, ty, tw, S, '#2818a8'); box(tx, ty + th, tw, S, '#2818a8');
  ctx.fillStyle = '#38d8ff';
  ctx.fillText(txt, W/2, ty + 16*S);
}

function drawAutoTag() {
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#6a86c8';
  ctx.font = `bold ${Math.round(11*S)}px monospace`;
  ctx.textAlign = 'left';
  ctx.fillText('◆ AUTO', 14*S, 26*S);
  ctx.globalAlpha = 1;
}

// ── Auto-pilot: aim for the centre of the next gap ───────────────
function autoPilot() {
  let target = H * 0.42;
  for (const p of pipes) {
    if (p.x + PIPE_W > BIRD_X - 4*S) { target = (p.topH + p.botY) / 2 - BIRD_BOX/2; break; }
  }
  if (bird.y > target - 6*S && bird.vy > -3.2*S) bird.vy = JUMP_V * 0.88;
}

// ── Shared physics step ──────────────────────────────────────────
function stepWorld() {
  const spd = BASE_SPD_FACTOR * S;   // constant speed, no ramp
  groundX += spd;
  bird.vy  = Math.min(bird.vy + GRAVITY, 10 * S);
  bird.y  += bird.vy;
  pipeTimer -= spd;
  if (pipeTimer <= 0) { spawnPipe(); pipeTimer = Math.round(280 * S); }
  for (const p of pipes) {
    p.x -= spd;
    if (!p.scored && p.x + PIPE_W < BIRD_X) { p.scored = true; score++; }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -PIPE_W);
}

function die() {
  deathWasManual = (state === 'playing');
  spawnBurst(BIRD_X + BIRD_BOX/2, bird.y + BIRD_BOX/2);
  if (deathWasManual) {
    lastScore = score;
    if (score > best) {
      best = score;
      try { localStorage.setItem('flappyMageBest', best); } catch (e) {}
    }
  }
  state     = 'dead';
  deadTimer = deathWasManual ? 130 : 22;
}

// ── Power saving ─────────────────────────────────────────────────
const FPS = 30, FRAME_MS = 1000 / FPS;
let lastFrameTime = 0, frameId = 0;

function frame(now) {
  frameId = requestAnimationFrame(frame);
  if (now - lastFrameTime < FRAME_MS) return;   // cap at 30fps
  lastFrameTime = now;
  t++;

  drawSky();
  drawStars();
  drawMoon();

  if (state === 'attract') {
    autoPilot();
    stepWorld();
    if (collides(bird.y)) die();
    for (const p of pipes) drawPipe(p.x, p.topH, p.botY);
    drawGround();
    tickParticles();
    drawBird(bird.y, bird.vy);
    drawAutoTag();
    drawHint();

  } else if (state === 'playing') {
    stepWorld();
    if (collides(bird.y)) die();
    else if (t - lastInputT > IDLE_REVERT) startGame('attract');
    for (const p of pipes) drawPipe(p.x, p.topH, p.botY);
    drawGround();
    tickParticles();
    drawBird(bird.y, bird.vy);
    drawScore();

  } else { // 'dead'
    deadTimer--;
    bird.vy = Math.min(bird.vy + GRAVITY, 10 * S);
    bird.y  = Math.min(bird.y + bird.vy, H - GROUND_H - BIRD_BOX);
    for (const p of pipes) drawPipe(p.x, p.topH, p.botY);
    drawGround();
    tickParticles();
    drawBird(bird.y, bird.vy);
    if (deathWasManual) drawToast(deadTimer > 30 ? 1 : deadTimer / 30);
    if (deadTimer <= 0) startGame('attract');
  }
}

// Pause when screen is off / window hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(frameId); }
  else requestAnimationFrame(frame);
});

// ── Controls ─────────────────────────────────────────────────────
document.addEventListener('mousedown',  onInput);
document.addEventListener('click',      onInput);
document.addEventListener('touchstart', e => { e.preventDefault(); onInput(); }, {passive: false});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); onInput(); }
});

// ── Boot ─────────────────────────────────────────────────────────
layout();
startGame('attract');
window.addEventListener('resize', () => {
  const wasAttract = state === 'attract' || state === 'dead';
  layout();
  if (wasAttract) startGame('attract');
});
requestAnimationFrame(frame);
</script>
</body>
</html>
